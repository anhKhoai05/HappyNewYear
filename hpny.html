<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Year 2026 - Fireworks Celebration</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #02020a; font-family: 'Arial', sans-serif; }
        #title-container {
            position: absolute; top: 30px; width: 100%; text-align: center;
            z-index: 10; pointer-events: none;
        }
        h1 {
            margin: 0; color: #FFB6C1; font-size: 3.5rem; letter-spacing: 5px;
            text-shadow: 0 0 20px rgba(255, 182, 193, 1); font-weight: bold;
        }
        #loading {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: #FFD700; font-size: 1.5rem; z-index: 20;
        }
        #hint {
            position: absolute; bottom: 20px; width: 100%; text-align: center;
            color: #ffffff; opacity: 0.8; z-index: 10; font-size: 1rem; background-color: rgba(0,0,0,0.5); padding: 10px 0;
        }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="title-container">
        <h1>HAPPY NEW YEAR 2026</h1>
    </div>
    <div id="loading">Đang chuẩn bị pháo hoa...</div>
    <div id="hint">Click vào BÁNH để bung tỏa ảnh kỷ niệm!</div>

    <audio id="bgMusic" loop>
        <source src="./picture/Một Năm Mới Bình An.mp3" type="audio/mpeg">
    </audio>

<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { FontLoader } from 'three/addons/loaders/FontLoader.js';
    import { TextGeometry } from 'three/addons/geometries/TextGeometry.js';
    import { MeshSurfaceSampler } from 'three/addons/math/MeshSurfaceSampler.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import gsap from 'https://cdn.skypack.dev/gsap';

    // --- LINK ẢNH ---
    const MY_PHOTOS = [
        './picture/Unknown.jpg',
        './picture/Unknown-2.jpg',
        './picture/Unknown-3.jpg',
        './picture/Unknown-4.jpg',
        './picture/Unknown-5.jpg',
        './picture/Unknown-6.jpg'
    ];

    const COUNT = 9000; 
    let currentState = 0;
    let scene, camera, renderer, controls, composer;
    let sphereMesh, cubeMesh;
    const dummy = new THREE.Object3D();
    const particlesData = [];
    const targetPositions = { cake: [], text: [], heart: [] };
    const candles = [];
    const photoFrames = [];
    let candleGroup;
    let isAudioPlaying = false;
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    let activeZoomedFrame = null;

    // Mảng chứa các vụ nổ pháo hoa đang hoạt động
    let activeExplosions = [];

    init();

    async function init() {
        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 15, 55);

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.4; 
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 1.2));
        
        const baseMat = new THREE.MeshStandardMaterial({ metalness: 0.1, roughness: 0.6 });
        sphereMesh = new THREE.InstancedMesh(new THREE.SphereGeometry(0.18, 8, 8), baseMat, COUNT / 2);
        cubeMesh = new THREE.InstancedMesh(new THREE.BoxGeometry(0.22, 0.22, 0.22), baseMat, COUNT / 2);
        scene.add(sphereMesh, cubeMesh);

        generateRoyalDecoratedCake();
        await generateTextPoints("2026", targetPositions.text, 10);
        await generateFlatHeartWithText();

        for (let i = 0; i < COUNT; i++) {
            const isSphere = i < COUNT / 2;
            const mesh = isSphere ? sphereMesh : cubeMesh;
            const idx = isSphere ? i : i - (COUNT / 2);
            
            let color = new THREE.Color(0xFFFFFF); 
            if (i % 3 === 0) color.set(0xFFB6C1); 
            if (i % 15 === 0) color.set(0xFF0000); 
            if (i % 20 === 0) color.set(0xFFD700); 

            mesh.setColorAt(idx, color);
            particlesData.push({
                currentPos: targetPositions.cake[i].clone(),
                mesh: mesh,
                index: idx,
                speed: 0.04 + Math.random() * 0.04
            });
        }
        sphereMesh.instanceColor.needsUpdate = true;
        cubeMesh.instanceColor.needsUpdate = true;

        createHighCandles();
        createPhotoFrames();

        composer = new EffectComposer(renderer);
        composer.addPass(new RenderPass(scene, camera));
        composer.addPass(new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.3, 0.5, 0.85));

        controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.5;

        window.addEventListener('click', onMouseClick);
        window.addEventListener('resize', onWindowResize);

        document.getElementById('loading').style.display = 'none';
        animate();
    }

    // --- HỆ THỐNG PHÁO HOA MỚI ---

    // 1. Hàm bắn pháo hoa (Rocket)
    function launchFirework() {
        const startX = (Math.random() - 0.5) * 30;
        const targetY = 15 + Math.random() * 10; // Nổ ở độ cao trên đỉnh bánh
        
        // Tạo một hạt "tên lửa" sáng
        const rocketGeo = new THREE.SphereGeometry(0.3, 8, 8);
        const rocketMat = new THREE.MeshBasicMaterial({ color: 0xFFD700 });
        const rocket = new THREE.Mesh(rocketGeo, rocketMat);
        rocket.position.set(startX, -25, 0); // Bắt đầu từ dưới đáy
        scene.add(rocket);

        // Bay lên bằng GSAP
        gsap.to(rocket.position, {
            y: targetY,
            duration: 1.5 + Math.random(),
            ease: "power2.out",
            onComplete: () => {
                scene.remove(rocket);
                createExplosion(rocket.position); // Nổ khi đến đích
            }
        });
    }

    // 2. Hàm tạo vụ nổ (Explosion)
    function createExplosion(position) {
        const particleCount = 150;
        const geo = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);
        const colors = new Float32Array(particleCount * 3);
        const velocities = [];

        const color = new THREE.Color();
        color.setHSL(Math.random(), 1, 0.6); // Màu ngẫu nhiên rực rỡ

        for (let i = 0; i < particleCount; i++) {
            positions[i * 3] = position.x;
            positions[i * 3 + 1] = position.y;
            positions[i * 3 + 2] = position.z;

            color.toArray(colors, i * 3);

            // Vận tốc nổ ngẫu nhiên theo hình cầu
            const velocity = new THREE.Vector3(
                (Math.random() - 0.5) * 2,
                (Math.random() - 0.5) * 2,
                (Math.random() - 0.5) * 2
            );
            velocity.normalize().multiplyScalar(Math.random() * 0.8);
            velocities.push(velocity);
        }

        geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        const mat = new THREE.PointsMaterial({
            size: 0.4,
            vertexColors: true,
            transparent: true,
            opacity: 1,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });

        const explosion = new THREE.Points(geo, mat);
        explosion.userData = { velocities, gravity: -0.015, life: 1.0 };
        scene.add(explosion);
        activeExplosions.push(explosion);
    }

    // --- CÁC HÀM CŨ (GIỮ NGUYÊN) ---
    function generateRoyalDecoratedCake() {
        const tiers = [{ r: 10, h: 4, y: -9 }, { r: 8.5, h: 4, y: -5 }, { r: 7, h: 4, y: -1 }, { r: 5.5, h: 4, y: 3 }, { r: 4, h: 4, y: 7 }];
        tiers.forEach(t => {
            const perTier = Math.floor(COUNT / 5);
            for (let i = 0; i < perTier; i++) {
                const angle = Math.random() * Math.PI * 2;
                const r = Math.random() > 0.7 ? t.r : Math.sqrt(Math.random()) * t.r;
                targetPositions.cake.push(new THREE.Vector3(r * Math.cos(angle), Math.random() * t.h + t.y, r * Math.sin(angle)));
            }
        });
        while(targetPositions.cake.length < COUNT) targetPositions.cake.push(new THREE.Vector3(0,0,0));
    }

    async function generateTextPoints(txt, targetArray, size) {
        const loader = new FontLoader();
        const font = await loader.loadAsync('https://unpkg.com/three@0.160.0/examples/fonts/helvetiker_bold.typeface.json');
        const geo = new TextGeometry(txt, { font: font, size: size, height: 1 });
        geo.center();
        const sampler = new MeshSurfaceSampler(new THREE.Mesh(geo)).build();
        const needed = COUNT - targetArray.length;
        for (let i = 0; i < needed; i++) {
            const p = new THREE.Vector3();
            sampler.sample(p);
            targetArray.push(p);
        }
    }

    async function generateFlatHeartWithText() {
        const textCount = Math.floor(COUNT * 0.3);
        const loader = new FontLoader();
        const font = await loader.loadAsync('https://unpkg.com/three@0.160.0/examples/fonts/helvetiker_bold.typeface.json');
        const textGeo = new TextGeometry("I LOVE YOU", { font: font, size: 3, height: 0.5 });
        textGeo.center(); textGeo.translate(0, 5, 0); 
        const sampler = new MeshSurfaceSampler(new THREE.Mesh(textGeo)).build();
        
        const pts = [];
        for(let i = 0; i < textCount; i++) {
            const p = new THREE.Vector3();
            sampler.sample(p);
            p.z = (Math.random() - 0.5) * 0.2; 
            pts.push(p);
        }
        for (let i = 0; i < (COUNT - textCount); i++) {
            const t = Math.random() * Math.PI * 2;
            let x = 16 * Math.pow(Math.sin(t), 3);
            let y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
            pts.push(new THREE.Vector3(x * 0.8, y * 0.8 + 5, (Math.random()-0.5)));
        }
        targetPositions.heart = pts.sort(() => Math.random() - 0.5);
    }

    function createHighCandles() {
        candleGroup = new THREE.Group();
        const candleGeo = new THREE.CylinderGeometry(0.12, 0.12, 3, 12);
        const candleMat = new THREE.MeshStandardMaterial({ color: 0xFFF0F5, emissive: 0xFFB6C1 });
        const flameGeo = new THREE.SphereGeometry(0.35, 8, 8);
        for (let i = 0; i < 8; i++) {
            const angle = (i / 8) * Math.PI * 2;
            const candle = new THREE.Mesh(candleGeo, candleMat);
            candle.position.set(Math.cos(angle) * 3.5, 13, Math.sin(angle) * 3.5);
            const flame = new THREE.Mesh(flameGeo, new THREE.MeshBasicMaterial({ color: 0xffcc00 }));
            flame.position.set(0, 1.8, 0); candle.add(flame);
            const light = new THREE.PointLight(0xff6600, 25, 12);
            light.position.set(0, 2, 0); candle.add(light);
            candles.push({ flame, light }); candleGroup.add(candle);
        }
        scene.add(candleGroup);
    }

    function createPhotoFrames() {
        const loader = new THREE.TextureLoader();
        MY_PHOTOS.forEach((url, i) => {
            const tex = loader.load(url);
            const frame = new THREE.Mesh(new THREE.PlaneGeometry(5, 7), new THREE.MeshLambertMaterial({ map: tex, side: THREE.DoubleSide }));
            const angle = (i / MY_PHOTOS.length) * Math.PI * 2;
            frame.position.set(Math.cos(angle) * 22, Math.random() * 8 - 4, Math.sin(angle) * 22);
            frame.scale.set(0.001, 0.001, 0.001); 
            frame.userData = { originalPos: frame.position.clone(), isZoomed: false };
            scene.add(frame);
            photoFrames.push(frame);
        });
    }

    function onMouseClick(event) {
        if (!isAudioPlaying) {
            document.getElementById('bgMusic').play();
            isAudioPlaying = true;
            controls.autoRotate = false;
        }

        mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
        raycaster.setFromCamera(mouse, camera);

        if (currentState === 1) {
            const intersects = raycaster.intersectObjects(photoFrames);
            if (intersects.length > 0) {
                const clickedFrame = intersects[0].object;
                if (activeZoomedFrame === clickedFrame) zoomOutFrame(clickedFrame);
                else {
                    if (activeZoomedFrame) zoomOutFrame(activeZoomedFrame);
                    zoomInFrame(clickedFrame);
                }
                return;
            }
        }

        if (activeZoomedFrame) zoomOutFrame(activeZoomedFrame);
        else changeFormationState();
    }

    function zoomInFrame(frame) {
        activeZoomedFrame = frame;
        frame.userData.isZoomed = true;
        const targetPos = new THREE.Vector3();
        camera.getWorldDirection(targetPos);
        targetPos.multiplyScalar(15).add(camera.position);
        gsap.to(frame.position, { x: targetPos.x, y: targetPos.y, z: targetPos.z, duration: 1.2, ease: "power2.out" });
    }

    function zoomOutFrame(frame) {
        frame.userData.isZoomed = false;
        activeZoomedFrame = null;
        gsap.to(frame.position, { x: frame.userData.originalPos.x, y: frame.userData.originalPos.y, z: frame.userData.originalPos.z, duration: 1 });
    }

    function changeFormationState() {
        currentState = (currentState + 1) % 3;
        gsap.to(candleGroup.scale, { 
            x: currentState === 0 ? 1 : 0.001, 
            y: currentState === 0 ? 1 : 0.001, 
            z: currentState === 0 ? 1 : 0.001, 
            duration: 0.6 
        });
        photoFrames.forEach(f => {
            const targetScale = (currentState === 1) ? 1 : 0.001;
            gsap.to(f.scale, { 
                x: targetScale, y: targetScale, z: targetScale, 
                duration: 1.2, ease: "back.out(1.7)", delay: Math.random() * 0.5 
            });
        });
        const hints = ["Click vào BÁNH để bung tỏa ảnh kỷ niệm!", "Click vào ẢNH để xem to | Click nền để xem Trái Tim", "Món quà tình yêu! Click nền để quay lại Bánh"];
        document.getElementById('hint').innerText = hints[currentState];
    }

    function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        composer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
        requestAnimationFrame(animate);
        const time = performance.now() * 0.001;

        // --- LOGIC TỰ ĐỘNG BẮN PHÁO HOA ---
        // Khoảng 1.5% cơ hội mỗi khung hình sẽ bắn một quả (tức là cứ ~1 giây có 1 quả)
        if (Math.random() < 0.015) {
            launchFirework();
        }

        // --- CẬP NHẬT CÁC VỤ NỔ ĐANG HOẠT ĐỘNG ---
        for (let i = activeExplosions.length - 1; i >= 0; i--) {
            const explosion = activeExplosions[i];
            const positions = explosion.geometry.attributes.position.array;
            const velocities = explosion.userData.velocities;
            explosion.userData.life -= 0.015; // Giảm tuổi thọ

            for (let j = 0; j < velocities.length; j++) {
                velocities[j].y += explosion.userData.gravity; // Áp dụng trọng lực
                positions[j * 3] += velocities[j].x;
                positions[j * 3 + 1] += velocities[j].y;
                positions[j * 3 + 2] += velocities[j].z;
            }
            explosion.geometry.attributes.position.needsUpdate = true;
            explosion.material.opacity = explosion.userData.life; // Mờ dần

            // Xóa vụ nổ khi hết tuổi thọ
            if (explosion.userData.life <= 0) {
                scene.remove(explosion);
                activeExplosions.splice(i, 1);
            }
        }
        
        // Logic hạt chính (giữ nguyên)
        let targets;
        if (currentState === 0) targets = targetPositions.cake;
        else if (currentState === 1) targets = targetPositions.text;
        else targets = targetPositions.heart;

        for (let i = 0; i < COUNT; i++) {
            const d = particlesData[i];
            const target = targets[i].clone();
            if (currentState === 0) target.y += Math.sin(time + i * 0.2) * 0.15;
            d.currentPos.lerp(target, 0.08);
            dummy.position.copy(d.currentPos);
            dummy.rotation.set(time * 0.3, time * 0.1, 0);
            dummy.updateMatrix();
            d.mesh.setMatrixAt(d.index, dummy.matrix);
        }
        sphereMesh.instanceMatrix.needsUpdate = true;
        cubeMesh.instanceMatrix.needsUpdate = true;

        if (currentState === 0) {
            candles.forEach((c, i) => {
                const f = Math.random() * 0.3 + 0.8;
                c.flame.scale.set(f, f + Math.sin(time * 20 + i) * 0.3, f);
                c.light.intensity = 30 * f;
            });
        }

        photoFrames.forEach((f, i) => {
            f.lookAt(camera.position);
            if (!f.userData.isZoomed && f.scale.x > 0.1) {
                f.position.y = f.userData.originalPos.y + Math.sin(time + i) * 0.5;
            }
        });

        controls.update();
        composer.render();
    }
</script>
</body>
</html>
